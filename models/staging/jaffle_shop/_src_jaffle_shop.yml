sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after: 
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at

    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: first_name
          - name: last_name
              
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: user_id
          - name: order_date
          - name: status
          - name: _etl_loaded_at
              
        

